name: Build Glasswave for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Glasswave-V4.1-Tauri-Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Glasswave
        run: npm run tauri build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Glasswave-V4.1-Windows-Installer
          path: Glasswave-V4.1-Tauri-Windows/src-tauri/target/release/bundle/nsis/*.exe
